<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    
    <div id="calculator">
        <input type="text" id="display" readonly>
        <div id="keys">
            <button onclick="appendtodisplay('+')" class="add">+</button>
            <button onclick="appendtodisplay('9')" class="as">9</button>
            <button onclick="appendtodisplay('8')"class="as">8</button>
            <button onclick="appendtodisplay('7')"class="as">7</button>
            <button onclick="appendtodisplay('-')" class="add">-</button>
            <button onclick="appendtodisplay('6')"class="as">6</button>
            <button onclick="appendtodisplay('5')"class="as">5</button>
            <button onclick="appendtodisplay('4')"class="as">4</button>
            <button onclick="appendtodisplay('*')" class="add">*</button>
            <button onclick="appendtodisplay('3')"class="as">3</button>
            <button onclick="appendtodisplay('2')"class="as">2</button>
            <button onclick="appendtodisplay('1')"class="as">1</button>
            <button onclick="appendtodisplay('/')"class="add">/</button>
            <button onclick="appendtodisplay('0')"class="as">0</button>
            <button onclick="claculate()"class="as">=</button>
            <button onclick="abdii()"class="as">C</button>

        </div>


    </div>
    <script src="calculator.js"></script>
</body>
</html>
